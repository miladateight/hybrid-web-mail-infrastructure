name: Quality

on:
  push:
    branches: [main, complete-case-study-v1.1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: JavaScript syntax
        run: |
          node --check scripts/privacy-scan.js
      - name: Privacy scan
        run: bash scripts/privacy-scan.sh
      - name: Markdown lint
        run: npx --yes markdownlint-cli2
      - name: YAML lint
        run: |
          python -m pip install --user yamllint
          yamllint .github/workflows
      - name: Mermaid diagram check
        run: grep -R '```mermaid' README.md README.de.md README.fa.md README.ar.md docs
      - name: Markdown privacy smoke check
        run: |
          ! grep -RInE -- '-----BEGIN|PrivateKey|PresharedKey' *.md docs diagrams || exit 1
      - name: Git whitespace check
        run: git diff --check

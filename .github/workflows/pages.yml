name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate required files
        run: node scripts/validate-required-files.js
      - name: Validate locales
        run: node scripts/validate-locales.js
      - name: Validate HTML and CSS
        run: |
          node scripts/validate-html.js
          node scripts/validate-css.js
      - name: Check links
        run: bash scripts/link-check.sh
      - name: Run privacy scan
        run: bash scripts/privacy-scan.sh
      - name: Stage public site
        run: |
          rm -rf _site
          mkdir -p _site/assets _site/locales
          cp index.html 404.html robots.txt _site/
          cp -R assets/css assets/icons assets/images assets/js _site/assets/
          cp -R locales/*.json _site/locales/
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        uses: actions/deploy-pages@v4

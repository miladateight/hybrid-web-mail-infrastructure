name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate locales
        run: node scripts/validate-locales.js

      - name: Check publication content
        run: bash scripts/privacy-scan.sh

      - name: Check public links
        run: bash scripts/check-links-relative.sh

      - name: Build public artifact
        run: |
          mkdir -p _site
          cp index.html 404.html robots.txt _site/
          cp -R assets locales _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        uses: actions/deploy-pages@v4

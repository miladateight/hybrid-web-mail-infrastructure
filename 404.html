<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Hybrid Infrastructure</title>
  <style>
    html { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101820; color: #eef6f8; font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(680px, calc(100% - 32px)); padding: 32px; border: 1px solid #294151; border-radius: 12px; background: #172634; }
    p { color: #aebfc8; }
    a { display: inline-flex; padding: 12px 18px; border-radius: 8px; background: #54d6b5; color: #071015; text-decoration: none; font-weight: 700; }
    a:focus-visible { outline: 3px solid #f2c94c; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p>Sanitized Production Case Study</p>
    <h1>Page not found</h1>
    <p>The requested portfolio page could not be found. No live infrastructure endpoint is connected to this site.</p>
    <a id="home-link" href="https://miladateight.github.io/hybrid-web-mail-infrastructure/">Back to the case study</a>
  </main>
  <script>
    (function () {
      var link = document.getElementById("home-link");
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") link.href = "./";
    }());
  </script>
</body>
</html>
